name: Sync upstream main

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into public main
    if: github.repository == 'x3cca/bitchat-android-nightly'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out public main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Merge current upstream main
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: permissionlesstech/bitchat-android
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --prune upstream main
          upstream_sha="$(git rev-parse upstream/main)"

          git config --local credential.helper '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          trap 'git config --local --unset-all credential.helper >/dev/null 2>&1 || true' EXIT

          git push --force origin refs/remotes/upstream/main:refs/heads/upstream-main

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            {
              echo "## Public main already current"
              echo
              echo "Upstream commit \`$upstream_sha\` is already contained in \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git merge --no-edit "$upstream_sha"
          git push origin HEAD:refs/heads/main

          {
            echo "## Synced public main"
            echo
            echo "Merged upstream commit \`$upstream_sha\` into \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
